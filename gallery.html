<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>You & Me ❤️</title>

<link rel="stylesheet" href="gallery.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>

<body>

<div class="hearts"></div>

<div class="container">

    <h1>You & Me ❤️</h1>

    <div class="gallery">

        <div class="polaroid">
            <img src="photo1.jpg" class="photo" alt="Photo 1">
            <span>🦊❤️</span>
        </div>

        <div class="polaroid">
            <img src="photo2.jpg" class="photo" alt="Photo 2">
            <span>💕</span>
        </div>

        <div class="polaroid">
            <img src="photo3.jpg" class="photo" alt="Photo 3">
            <span>🌸</span>
        </div>

        <div class="polaroid">
            <img src="photo4.jpg" class="photo" alt="Photo 4">
            <span>♾️❤️</span>
        </div>

    </div>

    <button id="nextBtn">
        Continue ❤️
    </button>

</div>

<div id="lightbox">

    <span id="close">&times;</span>

    <img id="lightboxImg" alt="Full Size Photo">

</div>

<script src="gallery.js"></script>

</body>
</html>
