<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Sumi ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Falling Petals -->
    <div class="petals"></div>

    <div class="card">

        <div class="flower">🌸</div>

        <h2>Hi Sumi</h2>

        <h1>
            I Made Something<br>
            Special For You ❤️
        </h1>

        <p>
            Tap the envelope to open<br>
            your little surprise...
        </p>

        <div class="envelope-container">

            <div class="envelope" id="envelope">

                <div class="back"></div>

                <div class="left"></div>

                <div class="right"></div>

                <div class="bottom"></div>

                <div class="letter"></div>

                <div class="flap"></div>

                <div class="heart">❤️</div>

            </div>

        </div>

        <div class="tap">
            TAP THE ENVELOPE
        </div>

        <div class="credit">
            Made with ❤️ by Tappu
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
